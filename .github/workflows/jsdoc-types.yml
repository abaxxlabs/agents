name: JSDoc Examples

# D35 drift prevention — extracts every @example block from src/**/*.ts and
# type-checks it against the live source types. If a JSDoc example references
# a field, type, or import that doesn't exist in the public API, this job fails.
#
# Background: an earlier JSDoc at src/vc-verifier.ts:207 promised
# AgentScope.create({ storage: { revocation: myRevocationStore } }). The
# `storage:` field was never added to AgentScopeConfig. Tests passed; users
# following the JSDoc got a runtime error. This check catches that class of
# drift at PR time, not after ship.
#
# See: scripts/extract-jsdoc-examples.ts for extraction and filtering logic.
on:
  push:
    branches:
      - main
      - 'breaking/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  jsdoc-typecheck:
    name: Type-check JSDoc @example blocks in src/
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Extract and type-check JSDoc @example blocks
        run: bun run ts-node-esm scripts/extract-jsdoc-examples.ts
